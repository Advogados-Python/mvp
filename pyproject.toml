# Só existe para o pacote `backend` poder ser importado de QUALQUER pasta (pip install -e .),
# por exemplo ao rodar `uvicorn backend.main:app` de dentro de backend/.
# As dependências ficam no requirements.txt (é o que o Docker usa).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ribeiro-e-souza"
version = "0.2.0"
description = "Leitor de processos judiciais: backend FastAPI + leitor de PDFs"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["backend*"]
