name: ribeiro-e-souza
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # Só para o notebook de apresentação (apresentacao.ipynb); o programa em si usa o requirements.txt
  - jupyterlab
  - ipykernel
  - pandas
  - pip:
      - -r requirements.txt   # dependências do programa (rode o comando na raiz do projeto)
      - httpx>=0.27           # só para os testes da API (fastapi.testclient)
